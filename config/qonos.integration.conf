# Integration test config.
# Run with:
#   export QONOS_TEST_DB_URL='mysql+aiomysql://root:root@127.0.0.1:3306/qonosv2_test'
#   pytest api/tests/integration -m integration -v

[keystone]
url = http://keystone.test:5000/v3
verify_ssl = false
username = qonos-service
password = secret
user_domain_name = Default

[database]
url = mysql+aiomysql://root@127.0.0.1:3306/qonos

[scheduler]
poll_interval_seconds = 0.1
log_level = INFO

[worker]
concurrency = 2
idle_sleep_seconds = 0.05
soft_timeout_seconds = 5.0
hard_timeout_seconds = 10.0
max_retry = 2
backoff_base_seconds = 0.01
backoff_max_seconds = 0.05
backoff_jitter = false
stale_processing_sweep_interval_seconds = 3600.0
server_snapshot_poll_interval_seconds = 0.1
server_snapshot_poll_timeout_seconds = 30.0

[notifications]
webhook_timeout_seconds = 3.0
