[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qonosv2"
version = "2.0.0"
description = "QonoS v2 scheduling service for OpenStack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "aiomysql>=0.2.0",
    "PyMySQL>=1.1.0",
    "aio-pika>=9.4.0",
    "httpx>=0.27.0",
    "croniter>=2.0.0",
    "pydantic>=2.9.0",
    "openstacksdk>=4.0.0",
    "alembic>=1.14.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "db*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
testpaths = ["api/tests"]
markers = [
    "integration: end-to-end tests using simulated OpenStack and a test database",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["api", "db"]
omit = [
    "api/tests/*",
    "db/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
(
  ^/db/migrations/
  | ^/\.venv/
  | ^/build/
  | ^/dist/
)
'''
