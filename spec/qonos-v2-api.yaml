    JobStatus:
      type: string
      enum:
        - QUEUED
        - PROCESSING
        - DONE
        - TIMED_OUT
        - ERROR
        - CANCELLED
        - HARD_TIMED_OUT
        - MAX_RETRIED
      description: |
        Full job state machine. Valid state transitions:
        
        **Initial State:**
        - Jobs are created in QUEUED state
        
        **From QUEUED:**
        - QUEUED -> PROCESSING (when worker picks up the job)
        - QUEUED -> CANCELLED (user cancels before processing starts)
        
        **From PROCESSING:**
        - PROCESSING -> DONE (successful completion)
        - PROCESSING -> ERROR (execution failure)
        - PROCESSING -> TIMED_OUT (soft timeout exceeded)
        - PROCESSING -> HARD_TIMED_OUT (hard timeout exceeded)
        - PROCESSING -> CANCELLED (user cancels during execution)
        
        **Retry Logic (if retries enabled):**
        - ERROR -> PROCESSING (retry attempt)
        - TIMED_OUT -> PROCESSING (retry attempt)
        - ERROR -> MAX_RETRIED (retry limit exceeded)
        - TIMED_OUT -> MAX_RETRIED (retry limit exceeded)
        
        **Terminal States:**
        - DONE, CANCELLED, HARD_TIMED_OUT, MAX_RETRIED

    Job:
      type: object
      required:
        - id
        - schedule_id
        - project_id
        - action_type
        - action_parameters
        - status
        - run_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        schedule_id:
          type: string
          format: uuid
          description: ID of the schedule this job was created from. All jobs are created from schedules.
        project_id:
          type: string
          description: Derived from the Keystone token; required for multi-tenant isolation.
          readOnly: true
        status:
          $ref: '#/components/schemas/JobStatus'
        action_type:
          type: string
          enum:
            - server_snapshot
            - volume_backup_full
            - volume_backup_incremental
          maxLength: 100
          description: Inherited from the schedule. Must be a registered action type from /actions.
        action_parameters:
          type: object
          description: |
            Inherited from the schedule. Must conform to the action_parameters_schema for this action_type
            (available via GET /actions/{action_type}). Server-side validation enforced.

            server_snapshot jobs snapshot server_id to a Glance image named
            {prefix}-{server_name}-{timestamp}.
            volume_backup_full jobs create a full Cinder backup of volume_id.
            volume_backup_incremental jobs create an incremental Cinder backup of volume_id and
            require a successful full backup for the same volume.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        run_at:
          type: string
          format: date-time
          description: Calculated from the schedule's cron expression. When the job should run.
        worker_id:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        retry_count:
          type: integer
          minimum: 0
        error_message:
          type: string
          nullable: true
          maxLength: 4096
        completed_at:
          type: string
          format: date-time
          nullable: true

