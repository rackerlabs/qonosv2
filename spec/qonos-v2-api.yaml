openapi: 3.0.3
info:
  title: QonoS v2 REST API
  description: |
    Foundational API contract for QonoS v2. This specification defines the data model,
    CRUD endpoints, job APIs, and follows OpenStack API conventions.
  version: 2.0.0

servers:
  - url: /v2
    description: QonoS v2 API

security:
  - X-Auth-Token: []

tags:
  - name: schedules
    description: Core resource for defining recurring actions.
  - name: execution-profiles
    description: Delegation profiles used by schedules for trust-based execution.
  - name: jobs
    description: Execution records generated from schedules.
  - name: job-executions
    description: Detailed tracking of job execution lifecycle and status.
  - name: actions
    description: Read-only registry of available action types
  - name: health
    description: Service health check endpoints.

paths:
  /:
    get:
      tags: [health]
      summary: API root
      description: Returns API version info. Use /schedules, /jobs, etc. for real endpoints.
      operationId: showRoot
      responses:
        '200':
          description: API info
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  version: { type: string }
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        rel: { type: string }
                        href: { type: string }
              example:
                name: QonoS v2 REST API
                version: "2.0.0"
                links:
                  - rel: self
                    href: /v2
                  - rel: health
                    href: /v2/health
                  - rel: schedules
                    href: /v2/schedules
                  - rel: jobs
                    href: /v2/jobs
                  - rel: actions
                    href: /v2/actions
        '500':
          $ref: '#/components/responses/InternalServerError'

  /schedules:
    get:
      tags: [schedules]
      summary: List schedules
      description: List schedules for the project (project_id from Keystone token). Supports marker/limit pagination.
      operationId: listSchedules
      parameters:
        - $ref: '#/components/parameters/Marker'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Success
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [schedules]
      summary: Create schedule
      description: Create a new schedule for recurring actions. project_id is derived from the Keystone token.
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /schedules/{schedule_id}:
    get:
      tags: [schedules]
      summary: Show schedule
      description: Return a single schedule by ID.
      operationId: showSchedule
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '200':
          description: Success
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [schedules]
      summary: Update schedule
      description: Update an existing schedule. Only provided fields are updated.
      operationId: updateSchedule
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      requestBody:
        content:
          application/json:
              schema:
                $ref: '#/components/schemas/ScheduleUpdate'
      responses:
        '200':
          description: Success
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [schedules]
      summary: Delete schedule
      description: Permanently delete a schedule and stop future runs.
      operationId: deleteSchedule
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
      responses:
        '204':
          description: No Content
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /execution-profiles:
    get:
      tags: [execution-profiles]
      summary: List execution profiles
      description: List execution profiles for the project (project_id from Keystone token).
      operationId: listExecutionProfiles
      parameters:
        - $ref: '#/components/parameters/Marker'
        - $ref: '#/components/parameters/Limit'
        - name: enabled
          in: query
          description: Filter by enabled flag
          schema:
            type: boolean
        - name: auth_type
          in: query
          description: Filter by auth type
          schema:
            type: string
            enum: [trust]
      responses:
        '200':
          description: Success
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionProfileList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [execution-profiles]
      summary: Create execution profile
      description: Create a project-scoped execution profile for delegated execution.
      operationId: createExecutionProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionProfileCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /execution-profiles/{execution_profile_id}:
    get:
      tags: [execution-profiles]
      summary: Show execution profile
      description: Return a single execution profile by ID.
      operationId: showExecutionProfile
      parameters:
        - $ref: '#/components/parameters/ExecutionProfileId'
      responses:
        '200':
          description: Success
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [execution-profiles]
      summary: Update execution profile
      description: Update an existing execution profile. Only provided fields are updated.
      operationId: updateExecutionProfile
      parameters:
        - $ref: '#/components/parameters/ExecutionProfileId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionProfileUpdate'
      responses:
        '200':
          description: Success
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [execution-profiles]
      summary: Delete execution profile
      description: Soft-delete an execution profile.
      operationId: deleteExecutionProfile
      parameters:
        - $ref: '#/components/parameters/ExecutionProfileId'
      responses:
        '204':
          description: No Content
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs:
    get:
      tags: [jobs]
      summary: List jobs
      description: List jobs for the project. Supports marker/limit pagination.
      operationId: listJobs
      parameters:
        - $ref: '#/components/parameters/Marker'
        - $ref: '#/components/parameters/Limit'
        - name: schedule_id
          in: query
          description: Filter jobs by schedule ID
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter jobs by status
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: action_type
          in: query
          description: Filter jobs by action type
          schema:
            type: string
            maxLength: 100
        - name: created_after
          in: query
          description: Filter jobs created after this timestamp
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          description: Filter jobs created before this timestamp
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Success
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [jobs]
      summary: Create job
      description: Create a job from a schedule.
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{job_id}:
    get:
      tags: [jobs]
      summary: Show job
      description: Return a single job by ID including status and execution metadata.
      operationId: showJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Success
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /jobs/{job_id}/cancel:
    post:
      tags: [jobs]
      summary: Cancel job
      description: Cancel a job (valid for QUEUED or PROCESSING).
      operationId: cancelJobViaPost
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '204':
          description: No Content
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [jobs]
      summary: Cancel job
      description: Cancel a job (valid for QUEUED or PROCESSING).
      operationId: cancelJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '204':
          description: No Content
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{job_id}/executions:
    get:
      tags: [job-executions]
      summary: List job executions
      description: List executions for a job. Supports marker/limit pagination.
      operationId: listJobExecutions
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/Marker'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Success
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobExecutionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /jobs/{job_id}/executions/{execution_id}:
    get:
      tags: [job-executions]
      summary: Show job execution
      description: Return a single job execution by ID with detailed result or error info.
      operationId: showJobExecution
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Success
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobExecution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /actions:
    get:
      tags: [actions]
      summary: List actions
      description: List available action types (read-only registry). Supports marker/limit pagination.
      operationId: listActions
      parameters:
        - $ref: '#/components/parameters/Marker'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Success
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /actions/{action_type}:
    get:
      tags: [actions]
      summary: Show action
      description: Get details for a single action type (schema for action_parameters, etc.).
      operationId: showAction
      parameters:
        - $ref: '#/components/parameters/ActionType'
      responses:
        '200':
          description: Success
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Action'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health:
    get:
      tags: [health]
      summary: Health check
      description: Service health endpoint.
      operationId: showHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health/live:
    get:
      tags: [health]
      summary: Liveness probe
      description: Liveness probe for orchestrators
      operationId: showHealthLive
      security: []
      responses:
        '200':
          description: Service is alive
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: Readiness probe; returns 200 when service can accept traffic.
      operationId: showHealthReady
      security: []
      responses:
        '200':
          description: Service is ready to accept traffic
          headers:
            X-Openstack-Request-Id:
              $ref: '#/components/headers/XOpenstackRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    X-Auth-Token:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: |
        Keystone authentication token. The project_id and roles are derived from the
        token. RBAC is enforced via keystone policies.

  headers:
    XOpenstackRequestId:
      description: Unique request identifier for tracing and debugging. Included in all responses.
      schema:
        type: string
    Location:
      description: URI of the newly created resource. Included in 201 Created responses.
      schema:
        type: string
        format: uri

  parameters:
    Marker:
      name: marker
      in: query
      description: The ID of the last seen item. Results start after this ID.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExecutionId:
      name: execution_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActionType:
      name: action_type
      in: path
      required: true
      description: Action type identifier (e.g. server_snapshot, volume_backup_full, volume_backup_incremental)
      schema:
        type: string
        maxLength: 100
    ExecutionProfileId:
      name: execution_profile_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Schedule:
      type: object
      required:
        - id
        - project_id
        - name
        - action_type
        - cron_expression
        - action_parameters
        - enabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project_id:
          type: string
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4096
        action_type:
          type: string
          enum:
            - server_snapshot
            - volume_backup_full
            - volume_backup_incremental
          description: |
            Must be one of the registered action types from /actions. Validation must check against
            the /actions registry at runtime.
        cron_expression:
          type: string
          description: |
            Cron expression defining when the schedule runs (e.g. five fields: minute hour day-of-month month day-of-week).
            Example "0 2 * * *" runs daily at 02:00. Validated server-side per runtime cron implementation.
          maxLength: 255
          example: "0 2 * * *"
        action_parameters:
          type: object
          description: |
            Structured JSON validated against the action_parameters_schema for the specified action_type.
            The schema is available via GET /actions/{action_type}. Server-side validation ensures that
            the parameters conform to the schema.

            server_snapshot: required server_id (UUID). Optional image_name_prefix (string).
            Glance image name is {prefix}-{server_name}-{timestamp} (default prefix
            qonos-server_snapshot; server_name from Nova or server_id; UTC YYYYMMDDHHMMSS; max 255 chars).

            volume_backup_full: required volume_id (UUID). Optional backup_name_prefix, description,
            container (strings). Backup name is {prefix}-{volume_name}-{timestamp} (default prefix
            qonos-volume_backup_full). In-use volumes are backed up with force.

            volume_backup_incremental: required volume_id (UUID). Optional backup_name_prefix,
            description, container (strings). Backup name is {prefix}-{volume_name}-{timestamp}
            (default prefix qonos-volume_backup_incremental). Requires a successful full backup for
            the same volume; waits if a full backup is in progress. In-use volumes are backed up with force.
          additionalProperties: true
          examples:
            server_snapshot:
              summary: server_snapshot parameters
              value:
                server_id: "123e4567-e89b-12d3-a456-426614174000"
                image_name_prefix: qonos-snapshot
            volume_backup_full:
              summary: volume_backup_full parameters
              value:
                volume_id: "223e4567-e89b-12d3-a456-426614174001"
                backup_name_prefix: qonos-backup
            volume_backup_incremental:
              summary: volume_backup_incremental parameters
              value:
                volume_id: "223e4567-e89b-12d3-a456-426614174001"
                backup_name_prefix: qonos-inc-backup
        webhook_url:
          type: string
          format: uri
          nullable: true
          description: Optional per-schedule webhook endpoint for job lifecycle notifications.
        retention_policy:
          $ref: '#/components/schemas/RetentionPolicy'
          description: |
            Optional. Count: {"type": "count", "value": N}. Age: {"type": "age", "max_age_days": N}.
        execution_profile_id:
          type: string
          format: uuid
          description: |
            Execution profile UUID used for delegated OpenStack trust execution.
            Required when creating schedules with action_type server_snapshot, volume_backup_full,
            or volume_backup_incremental.
        enabled:
          type: boolean
        next_run_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        last_run_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    RetentionPolicy:
      type: object
      additionalProperties: false
      required:
        - type
      description: |
        Optional per-schedule retention policy. Validated server-side (see properties for
        required fields per type).

        Retention runs after terminal job outcomes (DONE, HARD_TIMED_OUT, MAX_RETRIED) and
        only affects qonos_managed resources for the schedule.

        - type count: require value; max_age_days must be omitted. Keeps the newest value artifacts.
        - type age: require max_age_days; value must be omitted. Deletes artifacts older than max_age_days.

        - server_snapshot: Glance images
        - volume_backup_full: full Cinder backups (deleting a retained full backup may cascade-delete
          dependent incremental backups for the same volume)
        - volume_backup_incremental: incremental Cinder backups (requires an existing successful full
          backup for the same volume)

        value or max_age_days of 0 disables that dimension.
      properties:
        type:
          type: string
          enum: [count, age]
          description: Retention mode.
        value:
          type: integer
          minimum: 0
          description: |
            Required when type is count. Maximum number of artifacts to retain.
            Must not be set when type is age.
        max_age_days:
          type: integer
          minimum: 0
          description: |
            Required when type is age. Delete artifacts older than this many days.
            Must not be set when type is count.
      examples:
        count:
          summary: Keep newest 5 artifacts
          value:
            type: count
            value: 5
        age:
          summary: Delete artifacts older than 7 days
          value:
            type: age
            max_age_days: 7

