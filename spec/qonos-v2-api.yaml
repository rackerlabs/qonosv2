              summary: Schedule has active jobs
              value:
                errors:
                  - code: qonos.schedule.has_active_jobs
                    status: 409
                    title: Conflict
                    detail: Schedule cannot be deleted because it has active jobs (QUEUED or PROCESSING).
                    links:
