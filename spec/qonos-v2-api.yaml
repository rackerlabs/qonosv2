    Action:
      type: object
      description: Read-only registry entry for an available action type.
      required:
        - action_type
        - name
      properties:
        action_type:
          type: string
          maxLength: 100
          description: Identifier used in schedules/jobs (e.g. server_snapshot, volume_backup_full, volume_backup_incremental).
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable name.
        description:
          type: string
          nullable: true
          maxLength: 4096
        action_parameters_schema:
          type: object
          description: |
            JSON Schema that defines the structure and validation rules for action_parameters
            when using the specified action_type. Clients must provide action_parameters that conform
            to this schema. Server-side validation enforces compliance.

            server_snapshot: required server_id (Nova instance UUID). Optional image_name_prefix.
            Image naming: {prefix}-{server_name}-{timestamp} (default prefix qonos-server_snapshot).

            volume_backup_full: required volume_id (Cinder volume UUID). Optional
            backup_name_prefix, description, container. Backup naming:
            {prefix}-{volume_name}-{timestamp} (default prefix qonos-volume_backup_full).

            volume_backup_incremental: required volume_id (Cinder volume UUID). Optional
            backup_name_prefix, description, container. Backup naming:
            {prefix}-{volume_name}-{timestamp} (default prefix qonos-volume_backup_incremental).
            Requires a successful full backup for the same volume.

            Aligns with the action_types registry seed.
          additionalProperties: true
          examples:
            server_snapshot:
              summary: server_snapshot JSON Schema
              value:
                type: object
                required: [server_id]
                properties:
                  server_id:
                    type: string
                  image_name_prefix:
                    type: string
                additionalProperties: true
            volume_backup_full:
              summary: volume_backup_full JSON Schema
              value:
                type: object
                required: [volume_id]
                properties:
                  volume_id:
                    type: string
                  backup_name_prefix:
                    type: string
                  description:
                    type: string
                  container:
                    type: string
                additionalProperties: true
            volume_backup_incremental:
              summary: volume_backup_incremental JSON Schema
              value:
                type: object
                required: [volume_id]
                properties:
                  volume_id:
                    type: string
                  backup_name_prefix:
                    type: string
                  description:
                    type: string
                  container:
                    type: string
                additionalProperties: true

