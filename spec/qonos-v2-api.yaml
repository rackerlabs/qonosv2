  responses:
    BadRequest:
      description: Bad Request
      headers:
        X-Openstack-Request-Id:
          $ref: '#/components/headers/XOpenstackRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: qonos.validation_error
                status: 400
                title: Validation Error
                detail: "cron_expression: Invalid format."
                links:
